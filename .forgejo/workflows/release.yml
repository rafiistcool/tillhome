# Laeuft auf dem eigenen Forgejo-Runner. Image geht in die Forgejo-Registry (git.tillhome.de), nur amd64.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci --cache /cache/npm --prefer-offline
      - name: Typecheck and validate YAML
        run: npm run check
      - name: Build
        run: npm run build

  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Forgejo registry
        uses: docker/login-action@v3
        with:
          registry: git.tillhome.de
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: git.tillhome.de/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=tillhome
            org.opencontainers.image.description=YAML-driven static personal/ops link hub

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
