# Laeuft auf dem eigenen Forgejo-Runner (git.tillhome.de). Die GitHub-Variante unter .github/workflows ist auf GitHub deaktiviert.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci --cache /cache/npm --prefer-offline
      - name: Typecheck and validate YAML
        run: npm run check
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tillhome:ci .
