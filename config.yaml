# Personal / ops link hub. This is the only file you need to edit to add a link.
# After changing it, run `npm run build`, or restart the container if you mount
# this file at /config/config.yaml.

site:
  title: Home
  eyebrow: Welcome to
  heading: home.example.com
  name: Your name
  tagline: Personal services and shortcuts.
  description: Personal link hub for services on this host.
  footer: Static link hub. Add a site by editing config.yaml.

# Optional. Controls section order. Groups not listed still appear after these.
groups:
  - Reading
  - Services
  - Ops

# Each entry needs title + url. Everything else is optional.
# icon: a built-in line icon name (book-open, cloud, film, image, server, …
#       see README), `brand:<slug>` for a service logo (brand:jellyfin,
#       brand:nextcloud, brand:immich), or a path/URL to your own image.
#       Omit it to get a monogram of the title.
# Set example: true while an entry is a placeholder you still need to replace.
links:
  - title: Book Club
    url: https://books.example.com
    description: Club picks, notes, and the current reading list.
    icon: book-open
    group: Reading
    tags: [books]
    example: true

  - title: Notes
    url: https://notes.example.com
    description: Personal wiki and evergreen notes.
    icon: file-text
    group: Reading
    tags: [wiki]
    example: true

  - title: Photos
    url: https://photos.example.com
    description: Family albums and shared galleries.
    icon: brand:immich
    group: Services
    tags: [media]
    example: true

  - title: Search
    url: https://search.example.com
    description: Search across personal sources.
    icon: brand:jellyfin
    group: Services
    tags: [search]
    example: true

  - title: Git
    url: https://git.example.com
    description: Source repositories hosted on this domain.
    icon: git-branch
    group: Ops
    tags: [dev]
    example: true

  - title: Status
    url: https://status.example.com
    description: Uptime and service health.
    icon: activity
    group: Ops
    tags: [ops]
    example: true
